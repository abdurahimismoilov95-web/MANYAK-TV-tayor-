# Nixpacks configuration for Railway deployment
# MANYAK TV V2 - Monorepo with multiple services

[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg", "python3"]

[phases.install]
cmds = [
  "npm install --include=dev"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "npm start"

[variables]
NODE_ENV = "production"

