# Nginx Load Balancer Configuration for MANYAK TV
# File location: /etc/nginx/sites-available/manyak-tv-loadbalancer

# ═══ UPSTREAM: BACKEND SERVERS ═══
# PM2 cluster mode bilan ishlaydigan Node.js instance'lar
# Har bir instance alohida portda
upstream manyak_tv_backend {
    # Load balancing strategiyasi: least_conn (eng kam yuklangan serverga yo'naltiradi)
    # Alternativalar: round_robin (default), ip_hash (sticky sessions)
    least_conn;
    
    # Keepalive connections (performance)
    keepalive 64;
    
    # Backend servers (PM2 cluster instances yoki alohida serverlar)
    server 127.0.0.1:3000 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3001 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3002 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3003 weight=1 max_fails=3 fail_timeout=30s;
    
    # Backup server (barcha server ishlamasa)
    # server 127.0.0.1:3004 backup;
}

# ═══ RATE LIMITING ═══
# DDoS va abuse'dan himoya
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# ═══ MAIN SERVER BLOCK ═══
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    # ═══ HTTPS CONFIGURATION ═══
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;
    
    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # ═══ SECURITY HEADERS ═══
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self' https://web.telegram.org;" always;
    
    # ═══ GZIP COMPRESSION ═══
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    
    # ═══ CLIENT LIMITS ═══
    client_max_body_size 10M; # Max upload size (avatars, receipts)
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    # ═══ TIMEOUTS ═══
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;
    
    # ═══ LOGGING ═══
    access_log /var/log/nginx/manyak-tv-access.log combined;
    error_log /var/log/nginx/manyak-tv-error.log warn;
    
    # ═══ STATIC FILES (Frontend Build) ═══
    root /var/www/manyak-tv/dist;
    index index.html;
    
    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ═══ UPLOADS (User avatars, receipts, content media) ═══
    location /uploads {
        alias /var/www/manyak-tv/uploads;
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # ═══ API ENDPOINTS (Backend Proxy + Load Balancing) ═══
    location /api {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn addr 10;
        
        # Proxy to backend
        proxy_pass http://manyak_tv_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # WebSocket support (for SSE)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Buffering
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        
        # Health checks
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }
    
    # ═══ SERVER-SENT EVENTS (SSE) ═══
    location /events {
        proxy_pass http://manyak_tv_backend;
        proxy_http_version 1.1;
        
        # SSE-specific settings
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS for SSE
        add_header Cache-Control 'no-cache';
        add_header X-Accel-Buffering 'no';
    }
    
    # ═══ WEBHOOK (Telegram Bot) ═══
    location /webhook {
        # Rate limiting (prevent bot abuse)
        limit_req zone=api_limit burst=10 nodelay;
        
        proxy_pass http://manyak_tv_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ═══ HEALTH CHECK ENDPOINT ═══
    location /health {
        proxy_pass http://manyak_tv_backend;
        access_log off;
    }
    
    # ═══ SPA FALLBACK (React Router) ═══
    location / {
        try_files $uri $uri/ /index.html;
        
        # No caching for index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }
    
    # ═══ SECURITY: DENY SENSITIVE FILES ═══
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* (\.env|\.git|\.gitignore|\.md|package\.json|ecosystem\.config\.js)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ═══ OPTIONAL: SEPARATE ADMIN SUBDOMAIN ═══
# Admin panel uchun alohida subdomain (kuchaytirilgan xavfsizlik)
server {
    listen 443 ssl http2;
    server_name admin.your-domain.com;
    
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    
    # Admin panelga faqat ma'lum IP lardan kirish (opsional)
    # allow 203.0.113.0/24; # Your office/home IP
    # deny all;
    
    # Admin-only rate limiting (stricter)
    limit_req zone=api_limit burst=5 nodelay;
    
    location / {
        proxy_pass http://manyak_tv_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
