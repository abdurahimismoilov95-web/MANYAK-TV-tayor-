events {
    worker_connections 1024;
}

http {
    upstream api {
        server api:3000;
    }

    upstream bot {
        server bot:3001;
    }

    upstream encoder {
        server encoder:3002;
    }

    upstream web {
        server web:80;
    }

    # HLS streaming settings
    map $uri $hls_uri {
        ~^/streams/(.+)$ $1;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API
        location /api/ {
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Bot webhooks
        location /bot/ {
            proxy_pass http://bot/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Encoder
        location /encoder/ {
            proxy_pass http://encoder/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # HLS Streaming
        location /streams/ {
            alias /var/www/uploads/;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header Cache-Control "max-age=3600";
            add_header Access-Control-Allow-Origin "*";
        }

        # Uploads
        location /uploads/ {
            alias /var/www/uploads/;
            add_header Access-Control-Allow-Origin "*";
        }
    }
}
